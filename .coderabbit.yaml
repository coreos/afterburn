language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  poem: false
  in_progress_fortune: false
  review_status: true
  review_details: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true

  path_filters:
    - "!target/**"

  path_instructions:
    - path: "src/cli/**"
      instructions: >
        CLI argument parsing (clap). multi covers main operations
        (attributes, SSH keys, hostname, networks, check-in); exp is
        experimental. Preserve compatibility with existing systemd unit
        invocations.
    - path: "tests/**"
      instructions: >
        Test fixtures and TMT plans. Fixture JSON/YAML should remain
        valid against upstream schemas where validate.py checks apply.
        Prefer table-driven and mockito-based provider tests.
    - path: "docs/**"
      instructions: >
        Documentation served via GitHub Pages. Behavioral PRs
        must update docs/release-notes.md unless the PR has the
        skip-notes label. Keep docs/platforms.md aligned with supported
        providers.
    - path: ".github/workflows/**"
      instructions: >
        CI workflows are synced from coreos/repo-templates. Do not
        modify these files in normal PRs; flag edits as likely incorrect
        unless the change is explicitly about updating the sync.
    - path: ".copr/**"
      instructions: >
        COPR Makefile is synced from coreos/repo-templates. Do not
        modify unless the change is explicitly about the sync process.

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DNM"

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true
    autofix:
      enabled: true

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: >
        PR title must follow the format 'subsystem: description'.
        Examples: 'kubevirt: support static gateway and DNS with DHCP',
        'microsoft/azure: fix SharedConfig parsing of XML attributes',
        'docs/release-notes: update for release 5.10.0',
        '*: add coderabbit configuration'.
        Use imperative mood, lowercase after colon, no trailing period. Subject max 70 chars.
    description:
      mode: "warning"
    custom_checks:
      - name: "Commit message convention"
        mode: "warning"
        instructions: >
          Check that every non-merge commit message in this PR follows
          the format 'subsystem: description'. The subsystem is typically
          a provider or path prefix (e.g., 'kubevirt', 'microsoft/azure',
          'providers/hetzner'), a component name (e.g., 'docs', 'cargo',
          'ci'), or '*' for cross-cutting changes. After the colon and
          space, use imperative mood (e.g., 'add', 'fix', 'update').
          There must be no trailing period. Subject
          should be at most 70 characters. Merge commits (starting with
          'Merge') should be ignored. Flag any commit that does not
          conform.
      - name: "Release notes"
        mode: "warning"
        instructions: >
          Unless the PR has the skip-notes label, flag PRs that change
          user-visible behavior, providers, networking, systemd/dracut
          units, or packaging without updating docs/release-notes.md.

  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    # Disable tools irrelevant to this Rust project
    golangci-lint:
      enabled: false
    checkov:
      enabled: false
    clang:
      enabled: false
    cppcheck:
      enabled: false
    ruff:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    swiftlint:
      enabled: false
    detekt:
      enabled: false
    rubocop:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    oxc:
      enabled: false
    stylelint:
      enabled: false
    htmlhint:
      enabled: false
    brakeman:
      enabled: false
    fortitudeLint:
      enabled: false
    shopifyThemeCheck:
      enabled: false
    luacheck:
      enabled: false
    prismaLint:
      enabled: false
    sqlfluff:
      enabled: false
    squawk:
      enabled: false
    dotenvLint:
      enabled: false
    buf:
      enabled: false

chat:
  auto_reply: true
